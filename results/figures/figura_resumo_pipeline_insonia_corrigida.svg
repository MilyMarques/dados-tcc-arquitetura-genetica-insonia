  <rect width="1280" height="690" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">Síntese do pipeline: da estatística-resumo à interpretação funcional da insônia</text>

  <g fill="#f7f9fb" stroke="#44546a" stroke-width="1.3">
    <rect x="30" y="60" width="220" height="342" rx="8"/><rect x="280" y="60" width="220" height="342" rx="8"/>

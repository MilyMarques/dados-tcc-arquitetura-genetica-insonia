<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Fluxograma metodológico da caracterização da arquitetura genética da insônia</title>
  <desc id="desc">Fluxo dos quatro GWAS principais desde o controle de qualidade até o Core16, com ramos de sensibilidade, validação externa e análises contextuais que convergem para interpretação funcional e redes.</desc>
  <defs>
    <style>
      .title{font-family:Arial,sans-serif;font-size:34px;font-weight:700;fill:#12345A}
      .subtitle{font-family:Arial,sans-serif;font-size:17px;fill:#526273}
      .boxTitle{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#12345A;text-anchor:middle}
      .boxText{font-family:Arial,sans-serif;font-size:15px;fill:#243746;text-anchor:middle}
      .small{font-family:Arial,sans-serif;font-size:14px;fill:#526273}
      .branch{font-family:Arial,sans-serif;font-size:16px;font-weight:700;text-anchor:middle}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6A7A89"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#002B4F" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1600" height="1100" fill="#FFFFFF"/>
  <text x="800" y="62" class="title" text-anchor="middle">Fluxo metodológico do estudo de arquitetura genética da insônia</text>
  <text x="800" y="92" class="subtitle" text-anchor="middle">Pipeline reprodutível: priorização multiestudo, análises de robustez e interpretação funcional</text>

  <!-- Main pipeline -->
  <text x="800" y="137" class="branch" fill="#176B87">EVIDÊNCIA PRINCIPAL</text>
  <g filter="url(#shadow)">
    <rect x="65" y="162" width="250" height="126" rx="18" fill="#E4F2F8" stroke="#5BA6C5" stroke-width="2"/>
    <rect x="365" y="162" width="250" height="126" rx="18" fill="#E4F2F8" stroke="#5BA6C5" stroke-width="2"/>
    <rect x="665" y="162" width="270" height="126" rx="18" fill="#E4F2F8" stroke="#5BA6C5" stroke-width="2"/>
    <rect x="985" y="162" width="250" height="126" rx="18" fill="#E4F2F8" stroke="#5BA6C5" stroke-width="2"/>
    <rect x="1285" y="162" width="250" height="126" rx="18" fill="#DCEFE4" stroke="#5C9C75" stroke-width="2.5"/>
  </g>
  <text x="190" y="204" class="boxTitle">Quatro GWAS principais</text>
  <text x="190" y="231" class="boxText">Hammerschlag · Lane</text><text x="190" y="253" class="boxText">Jansen · Watanabe</text>
  <text x="490" y="204" class="boxTitle">Padronização e QC</text>
  <text x="490" y="231" class="boxText">Autossomos 1–22 · alelos</text><text x="490" y="253" class="boxText">P, SE, N, INFO/MAF e rsID</text>
  <text x="800" y="204" class="boxTitle">FUMA SNP2GENE + MAGMA</text>
  <text x="800" y="231" class="boxText">Loci GWAS · mapeamento SNP–gene</text><text x="800" y="253" class="boxText">associação gene-based por estudo</text>
  <text x="1110" y="204" class="boxTitle">Integração entre estudos</text>
  <text x="1110" y="231" class="boxText">Loci compartilhados · matriz</text><text x="1110" y="253" class="boxText">gene × modalidade × estudo</text>
  <text x="1410" y="204" class="boxTitle">Core16</text>
  <text x="1410" y="231" class="boxText">Bonferroni em ≥2 unidades</text><text x="1410" y="253" class="boxText">+ ≥1 mapeamento SNP2GENE</text>
  <path d="M315 225 H365" fill="none" stroke="#6A7A89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M615 225 H665" fill="none" stroke="#6A7A89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M935 225 H985" fill="none" stroke="#6A7A89" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1235 225 H1285" fill="none" stroke="#6A7A89" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Side branches -->
  <text x="420" y="370" class="branch" fill="#7D4E9E">ROBUSTEZ E VALIDAÇÃO</text>
  <text x="1180" y="370" class="branch" fill="#B66A1C">CAMADAS CONTEXTUAIS</text>
  <g filter="url(#shadow)">
    <rect x="115" y="397" width="245" height="115" rx="17" fill="#F2E8F8" stroke="#A979C3" stroke-width="2"/>
    <rect x="480" y="397" width="245" height="115" rx="17" fill="#F2E8F8" stroke="#A979C3" stroke-width="2"/>
    <rect x="875" y="397" width="190" height="115" rx="17" fill="#FFF0DF" stroke="#D5944B" stroke-width="2"/>
    <rect x="1085" y="397" width="190" height="115" rx="17" fill="#FFF0DF" stroke="#D5944B" stroke-width="2"/>
    <rect x="1295" y="397" width="190" height="115" rx="17" fill="#FFF0DF" stroke="#D5944B" stroke-width="2"/>
  </g>
  <text x="238" y="436" class="boxTitle">UKB OpenGWAS</text><text x="238" y="463" class="boxText">Sensibilidade técnica</text><text x="238" y="485" class="boxText">Não redefine o Core16</text>
  <text x="603" y="436" class="boxTitle">FinnGen R13</text><text x="603" y="463" class="boxText">Validação externa</text><text x="603" y="485" class="boxText">Endpoint clínico F5_INSOMNIA</text>
  <text x="970" y="436" class="boxTitle">Legacy28</text><text x="970" y="463" class="boxText">Sensibilidade</text><text x="970" y="485" class="boxText">histórica</text>
  <text x="1180" y="436" class="boxTitle">HCP289</text><text x="1180" y="463" class="boxText">Contexto publicado</text><text x="1180" y="485" class="boxText">de Watanabe</text>
  <text x="1390" y="436" class="boxTitle">GWAS Catalog</text><text x="1390" y="463" class="boxText">Associações</text><text x="1390" y="485" class="boxText">publicadas</text>
  <path d="M1370 288 V335 H238 V397" fill="none" stroke="#A979C3" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1450 288 V335 H603 V397" fill="none" stroke="#A979C3" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1410 288 V350 H970 V397" fill="none" stroke="#D5944B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1410 288 V350 H1180 V397" fill="none" stroke="#D5944B" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M1410 288 V350 H1390 V397" fill="none" stroke="#D5944B" stroke-width="2.2" marker-end="url(#arrow)"/>

  <!-- Interpretation -->
  <path d="M238 512 V590 H800" fill="none" stroke="#6A7A89" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M603 512 V590 H800" fill="none" stroke="#6A7A89" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M970 512 V590 H800" fill="none" stroke="#6A7A89" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M1180 512 V590 H800" fill="none" stroke="#6A7A89" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M1390 512 V590 H800" fill="none" stroke="#6A7A89" stroke-width="2.3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="430" y="590" width="740" height="190" rx="22" fill="#EAF3EC" stroke="#5C9C75" stroke-width="2.5"/></g>
  <text x="800" y="636" class="boxTitle" style="font-size:25px">Interpretação funcional e redes</text>
  <text x="800" y="671" class="boxText" style="font-size:17px">GENE2FUNC · g:Profiler · ShinyGO · STRING</text>
  <line x1="555" y1="700" x2="555" y2="748" stroke="#B4C8BA" stroke-width="1.5"/>
  <line x1="1045" y1="700" x2="1045" y2="748" stroke="#B4C8BA" stroke-width="1.5"/>
  <text x="680" y="723" class="boxText">Sobre-representação e</text><text x="680" y="745" class="boxText">expressão gênica</text>
  <text x="925" y="723" class="boxText">Redes de associação</text><text x="925" y="745" class="boxText">funcional proteína–proteína</text>

  <!-- Footer note -->
  <rect x="215" y="855" width="1170" height="125" rx="14" fill="#F7F9FB" stroke="#CCD7E1" stroke-width="1.5"/>
  <text x="250" y="892" class="small" font-weight="700">Princípio de interpretação:</text>
  <text x="250" y="921" class="small">Core16 foi definido exclusivamente pela convergência MAGMA/SNP2GENE nos estudos principais.</text>
  <text x="250" y="947" class="small">Sensibilidades, validação externa e listas contextuais foram analisadas posteriormente e não alteraram sua composição.</text>
  <circle cx="255" cy="1030" r="8" fill="#5BA6C5"/><text x="272" y="1035" class="small">evidência principal</text>
  <circle cx="560" cy="1030" r="8" fill="#A979C3"/><text x="577" y="1035" class="small">robustez e validação</text>
  <circle cx="865" cy="1030" r="8" fill="#D5944B"/><text x="882" y="1035" class="small">camadas contextuais</text>
  <circle cx="1170" cy="1030" r="8" fill="#5C9C75"/><text x="1187" y="1035" class="small">interpretação posterior</text>
</svg>
